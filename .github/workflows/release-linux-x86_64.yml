name: Release Linux x86-64 binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    # Keep release automation on the x86-64 GitHub-hosted runner.
    if: runner.arch == 'X64'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # Tag push is the whole release action: the workflow creates the
      # published release itself, so a release must never be created by hand.
      - name: Check out the pushed tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Confirm the runner is x86-64
        run: test "$(uname -m)" = x86_64

      # The tarball name comes from Cargo.toml, so a mismatched tag would
      # publish an asset whose version does not match the release; fail early.
      - name: Confirm the tag matches Cargo.toml version
        run: |
          version="$(awk -F '"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)"
          echo "tag=${GITHUB_REF_NAME} cargo_version=${version}"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build and package static binaries
        working-directory: docker
        run: make package

      - name: Verify static Linux x86-64 binaries
        working-directory: docker
        run: |
          set -euo pipefail
          for binary in ciri ciri-simulator ciri-merge ciri-assemble; do
            file "dist/${binary}" | grep -q 'x86-64'
            if readelf -l "dist/${binary}" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
              echo "ERROR: ${binary} has a dynamic interpreter" >&2
              exit 1
            fi
            "./dist/${binary}" --help >/dev/null
          done

      - name: Select release assets
        id: assets
        run: |
          set -euo pipefail
          package="$(find docker/dist -maxdepth 1 -type f \
            -name 'ciri-toolkit-*-linux-x86_64-musl.tar.gz' -print -quit)"
          test -n "${package}"
          checksum="${package}.sha256"
          sha256sum "${package}" > "${checksum}"
          {
            printf 'package=%s\n' "${package}"
            printf 'checksum=%s\n' "${checksum}"
          } >> "$GITHUB_OUTPUT"

      # Idempotent on re-run: keep an existing release instead of failing, so a
      # retried job only refreshes the assets. --generate-notes lets GitHub
      # build the notes from commits since the previous tag.
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE: ${{ steps.assets.outputs.package }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$PACKAGE" \
            "$CHECKSUM" \
            --clobber
